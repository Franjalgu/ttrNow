 * Editor de momento
 * ------------------------------------------------------------------ */
let recorder=null, recChunks=[], recStart=0, recTimer=null;

function openEditor(moment, isNew){
  const m=JSON.parse(JSON.stringify(moment));
  m.tags=m.tags||[]; m.peopleIds=m.peopleIds||[]; m.photos=m.photos||[]; m.audio=m.audio||[]; m.fields=m.fields||{};
  const pendingMedia={photos:[], audio:[]};   // media nueva, se borra si cancelas
  let saved=false, pararVozAlCerrar=null;
  /* si cierras sin guardar, la media que acabas de adjuntar no se queda de okupa */
  const onClose=async ()=>{
    if(pararVozAlCerrar) pararVozAlCerrar();
    if(saved) return;
    const stored=MOMENTS.find(x=>x.id===m.id);
    const keep=new Set();
    if(stored){ (stored.photos||[]).forEach(p=>{keep.add(p.id); keep.add(p.thumbId);}); (stored.audio||[]).forEach(a=>keep.add(a.id)); }
    const trash=[];
    for(const p of pendingMedia.photos) if(!keep.has(p.id)){ trash.push(p.id); if(p.thumbId) trash.push(p.thumbId); }
    for(const a of pendingMedia.audio) if(!keep.has(a.id)) trash.push(a.id);
    if(trash.length) await deleteMedia(trash);
  };

  openSheet(isNew? 'Nuevo momento' : 'Editar momento', (body, sheet)=>{
    body.innerHTML=
      '<div class="typebar" role="group" aria-label="Tipo de momento">'+
        Object.keys(TYPES).map(k=>'<button type="button" data-type="'+k+'" aria-pressed="'+(m.type===k)+'">'+esc(TYPES[k].label)+'</button>').join('')+
      '</div>'+
      '<div class="f" id="presetWrap" hidden><label>Tipo de ficha</label>'+
        '<div class="presets" role="group" aria-label="Tipo de ficha">'+

        '<datalist id="dl-places"></datalist></div>'+
      '<div class="f" id="g-people" hidden>'+
        '<label class="lblrow">Personas<button type="button" id="peopleManage" class="minibtn">Gestionar</button></label>'+

      '<div class="f" id="g-tags" hidden><label>Etiquetas</label><div class="chips" id="tagChips"></div>'+
        '<input type="text" id="e-tag" placeholder="Añadir etiqueta y pulsar Intro" autocomplete="off"></div>'+

      '<button class="save" id="e-save">Guardar</button>'+
      (isNew?'':'<button class="ghostbtn danger" id="e-del">Borrar este momento</button>');

    const title=$('#e-title',body), note=$('#e-note',body), dt=$('#e-dt',body);
    title.value=m.title||''; note.value=m.note||'';
    dt.value=toLocalInput(new Date(m.datetime));

    if(m.peopleIds.length){ $('#g-people',body).hidden=false; $('[data-t=people]',body).classList.add('on'); }
    if(m.tags.length){ $('#g-tags',body).hidden=false; $('[data-t=tags]',body).classList.add('on'); }

    /* tipo */
    $$('[data-type]',body).forEach(b=>b.addEventListener('click',()=>{
      m.type=b.dataset.type;
      $$('[data-type]',body).forEach(x=>x.setAttribute('aria-pressed', String(x.dataset.type===m.type)));
      $('#presetWrap',body).hidden = m.type!=='ficha';
      if(m.type==='ficha' && !m.preset) m.preset='vino';
      markPreset(); drawFields();
    }));
    $('#presetWrap',body).hidden = m.type!=='ficha';
    function markPreset(){
      $$('[data-preset]',body).forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.preset===m.preset)));
    }
    markPreset();
    $$('[data-preset]',body).forEach(b=>b.addEventListener('click',()=>{
      m.preset=b.dataset.preset; markPreset(); drawFields();
    }));

    function drawFields(){
      const box=$('#e-fields',body);
      if(m.type!=='ficha' || !m.preset || !PRESETS[m.preset]){ box.innerHTML=''; return; }
      const p=PRESETS[m.preset];
      box.innerHTML=p.fields.map(f=>{
        const v=m.fields[f.k]||'';
        if(f.type==='rating'){
          return '<div class="f"><label>'+esc(f.l)+'</label><div class="rate" data-k="'+f.k+'">'+
            [1,2,3,4,5].map(i=>'<button type="button" data-v="'+i+'" class="'+(+v>=i?'on':'')+'" aria-label="'+i+' de 5">★</button>').join('')+
            '</div></div>';
        }
        return '<div class="f"><label for="ff-'+f.k+'">'+esc(f.l)+'</label>'+
          '<input type="'+(f.type==='number'?'number':'text')+'" id="ff-'+f.k+'" data-k="'+f.k+'" value="'+esc(v)+'" autocomplete="off"></div>';
      }).join('');
      $$('#e-fields input',body).forEach(i=>i.addEventListener('input',()=>{ m.fields[i.dataset.k]=i.value; }));
      $$('.rate',body).forEach(r=>r.addEventListener('click',e=>{
        const b=e.target.closest('button'); if(!b) return;
        const v=+b.dataset.v; m.fields[r.dataset.k]=String(v);
        $$('button',r).forEach(x=>x.classList.toggle('on', +x.dataset.v<=v));
      }));
    }
    drawFields();

    /* herramientas que revelan campos */
    $$('[data-t]',body).forEach(b=>b.addEventListener('click',()=>{
      const g=$('#g-'+b.dataset.t,body);
      g.hidden=!g.hidden; b.classList.toggle('on',!g.hidden);
      if(!g.hidden){ const i=$('input',g); i&&i.focus(); }
    }));

    /* personas y etiquetas como chips */
    let gestionando=false, porBorrar=null;
    function drawPeople(){
      const box=$('#peopleChips',body);
      const known=PEOPLE.slice().sort((a,b)=>a.name.localeCompare(b.name));
      box.innerHTML=known.map(p=>{
        const puesta=m.peopleIds.indexOf(p.id)>=0;
        const chip='<button type="button" class="chip'+(puesta?' p':'')+'" data-pid="'+p.id+'">'+esc(p.name)+'</button>';
        if(!gestionando) return chip;
        const confirmando = porBorrar===p.id;
        return '<span class="chipwrap">'+chip+
          '<button type="button" class="chipdel'+(confirmando?' go':'')+'" data-delpid="'+p.id+'" '+
          'aria-label="'+(confirmando?'Confirmar borrado de ':'Borrar a ')+esc(p.name)+'">'+
          (confirmando?'borrar':'&times;')+'</button></span>';
      }).join('') || '<span style="font-size:11.5px;color:var(--faint)">Escribe abajo para crear la primera</span>';
      const ges=$('#peopleManage',body);
      if(ges){ ges.textContent=gestionando?'Hecho':'Gestionar'; ges.hidden=!known.length; }
      $$('[data-pid]',box).forEach(b=>b.addEventListener('click',()=>{
        const i=m.peopleIds.indexOf(b.dataset.pid);
        if(i>=0) m.peopleIds.splice(i,1); else m.peopleIds.push(b.dataset.pid);
        porBorrar=null; drawPeople();
      }));
      $$('[data-delpid]',box).forEach(b=>b.addEventListener('click',async ()=>{
        const id=b.dataset.delpid;
        if(porBorrar!==id){ porBorrar=id; drawPeople(); return; }   // primer toque: avisa
        porBorrar=null;
        await borrarPersona(id);
      }));
    }
    /* Borra a una persona de verdad y la quita de todos los momentos donde
       estuviera: si no, quedarían referencias a un nombre que ya no existe. */
    async function borrarPersona(id){
      const p=PMAP.get(id);
      const tocados=MOMENTS.filter(x=>(x.peopleIds||[]).indexOf(id)>=0);
      for(const t of tocados){
        t.peopleIds=t.peopleIds.filter(v=>v!==id);
        t.updatedAt=new Date().toISOString();
        const copia=Object.assign({},t); delete copia._doc; delete copia._toks;
        await dbPut('moments', copia);
      }
      await dbDel('people', id);
      PEOPLE=PEOPLE.filter(x=>x.id!==id); PMAP.delete(id);
      m.peopleIds=m.peopleIds.filter(v=>v!==id);
      drawPeople();
      await refreshAll();
      toast((p?p.name:'Persona')+' borrada'+(tocados.length?' · quitada de '+tocados.length+' momento'+(tocados.length===1?'':'s'):''));
    }
    drawPeople();
    $('#peopleManage',body).addEventListener('click',()=>{ gestionando=!gestionando; porBorrar=null; drawPeople(); });
    $('#e-person',body).addEventListener('keydown',async e=>{
      if(e.key!=='Enter') return; e.preventDefault();
      const v=e.target.value.trim(); if(!v) return;
      const id=await ensurePerson(v);
      if(id && m.peopleIds.indexOf(id)<0) m.peopleIds.push(id);
      e.target.value=''; drawPeople();
    });
    function drawTags(){
      const box=$('#tagChips',body);
      const all=new Set(m.tags);
      for(const mm of MOMENTS) for(const t of (mm.tags||[])) all.add(t);
      box.innerHTML=Array.from(all).sort().map(t=>'<button type="button" class="chip'+(m.tags.indexOf(t)>=0?' p':'')+'" data-tag="'+esc(t)+'">#'+esc(t)+'</button>').join('')
        || '<span style="font-size:11.5px;color:var(--faint)">Sin etiquetas todavía</span>';
      $$('[data-tag]',box).forEach(b=>b.addEventListener('click',()=>{
        const t=b.dataset.tag, i=m.tags.indexOf(t);
        if(i>=0) m.tags.splice(i,1); else m.tags.push(t);
        drawTags();
      }));
    }
    drawTags();
    $('#e-tag',body).addEventListener('keydown',e=>{
      if(e.key!=='Enter') return; e.preventDefault();
      const v=e.target.value.trim().replace(/^#/,''); if(!v) return;
      if(m.tags.indexOf(v)<0) m.tags.push(v);
      e.target.value=''; drawTags();
    });

    /* fotos */
    async function drawPhotos(){
      const wrap=$('#photoWrap',body); wrap.innerHTML='';
      for(const ph of m.photos){
        const fig=document.createElement('figure');
        const img=document.createElement('img'); img.alt=ph.alt||'Foto adjunta';
        const u=await mediaURL(ph.thumbId||ph.id); if(u) img.src=u;
        const del=document.createElement('button'); del.type='button'; del.innerHTML='&times;'; del.setAttribute('aria-label','Quitar foto');
        del.addEventListener('click',()=>{
          m.photos=m.photos.filter(x=>x.id!==ph.id);
          pendingMedia.photos.push(ph);
          drawPhotos();
        });
        fig.appendChild(img); fig.appendChild(del); wrap.appendChild(fig);
      }
    }
    drawPhotos();
    $('#t-photo',body).addEventListener('click',()=>pickPhotos(async files=>{
      $('#t-photo',body).classList.add('on');
      let firstDate=null;
      for(const f of files){
        try{
          const ph=await savePhoto(f);
          m.photos.push(ph); pendingMedia.photos.push(ph);
          if(!firstDate && ph.takenAt) firstDate=ph.takenAt;
        }catch(err){ toast('No pude leer una de las fotos'); }
      }
      drawPhotos();
      if(firstDate){
        const d=new Date(firstDate);
        if(Math.abs(d - new Date(dt.value)) > 3600e3){
          const bar=document.createElement('div');
          bar.className='hint'; bar.style.cssText='margin-top:6px;font-size:12px;color:var(--brass);cursor:pointer';
          bar.textContent='La foto es del '+fmtFechaLarga(d)+'. Usar esa fecha';
          bar.addEventListener('click',()=>{ dt.value=toLocalInput(d); bar.remove(); });
          $('#photoWrap',body).after(bar);
        }
      }
    }));

    /* ---- notas de voz ----
       Antes grabar y parar eran el mismo botón: no veías si estaba grabando
       ni dónde acababa la nota. Ahora "Voz" solo empieza, y mientras grabas
       aparece una barra con el tiempo corriendo, una onda que se mueve con
       tu voz y dos acciones distintas. Al terminar, la nota aparece en su
       lista, se resalta y se sube a la vista. */
    function drawAudio(destacar){
      const wrap=$('#audioWrap',body);
      wrap.innerHTML = m.audio.length ? '<label>Notas de voz</label>' : '';
      let nueva=null;
      m.audio.forEach(au=>{
        const div=document.createElement('div');
        div.className='aud'+(destacar===au.id?' nueva':'');
        if(destacar===au.id) nueva=div;
        const a=document.createElement('audio');
        a.controls=true; a.preload='metadata';
        arreglarDuracion(a);
        mediaURL(au.id).then(u=>{ if(u) a.src=u; });
        div.appendChild(a);
        if(au.dur){ const d=document.createElement('span'); d.className='adur'; d.textContent=fmtDur(au.dur); div.appendChild(d); }
        const del=document.createElement('button'); del.type='button'; del.textContent='Quitar';
        del.className='minidel';
        del.addEventListener('click',()=>{ m.audio=m.audio.filter(x=>x.id!==au.id); pendingMedia.audio.push(au); drawAudio(); });
        div.appendChild(del);
        wrap.appendChild(div);
      });
      if(nueva) setTimeout(()=>nueva.scrollIntoView({block:'center',behavior:'smooth'}), 80);
    }
    drawAudio();

    const recBtn=$('#t-rec',body), recPanel=$('#recPanel',body);
    let recStream=null, recCtx=null, recRaf=null, recDiscard=false;

    /* la onda es la prueba visible de que te está oyendo */
    function pintarOnda(analizador, lienzo){
      const cx=lienzo.getContext('2d');
      const dpr=Math.min(2, window.devicePixelRatio||1);
      const w=Math.max(60, lienzo.clientWidth), h=26;
      lienzo.width=w*dpr; lienzo.height=h*dpr; cx.setTransform(dpr,0,0,dpr,0,0);
      const datos=new Uint8Array(analizador.frequencyBinCount);
      const barras=16, hist=new Array(barras).fill(0);
      const paso=()=>{
        recRaf=requestAnimationFrame(paso);
        analizador.getByteTimeDomainData(datos);
        let pico=0;
        for(let i=0;i<datos.length;i++){ const v=Math.abs(datos[i]-128)/128; if(v>pico) pico=v; }
        hist.push(Math.min(1, pico*2.4)); hist.shift();
        cx.clearRect(0,0,w,h);
        const bw=w/barras;
        for(let i=0;i<barras;i++){
          const a=Math.max(.09, hist[i]), bh=Math.max(2, a*h);
          cx.fillStyle='rgba(224,138,122,'+(.32+a*.68).toFixed(3)+')';
          cx.fillRect(i*bw+bw*.22, (h-bh)/2, bw*.56, bh);
        }
      };
      paso();
    }
    function pararTodoDeVoz(){
      clearInterval(recTimer); recTimer=null;
      if(recRaf) cancelAnimationFrame(recRaf); recRaf=null;
      if(recCtx){ try{ recCtx.close(); }catch(e){} recCtx=null; }
      if(recStream){ recStream.getTracks().forEach(t=>t.stop()); recStream=null; }
      recPanel.hidden=true; recPanel.innerHTML='';
      recBtn.classList.remove('rec'); recBtn.disabled=false;
    }
    async function empezarVoz(){
      if(recorder && recorder.state==='recording') return;
      try{
        recStream=await navigator.mediaDevices.getUserMedia({audio:{channelCount:1,echoCancellation:true,noiseSuppression:true}});
      }catch(err){ toast('No puedo usar el micrófono'); return; }
      const mime=['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/aac']
        .find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported(t))||'';
      try{
        recorder=new MediaRecorder(recStream, mime?{mimeType:mime, audioBitsPerSecond:48000}:{});
      }catch(err){ toast('Este navegador no sabe grabar audio'); pararTodoDeVoz(); return; }
      recChunks=[]; recStart=Date.now(); recDiscard=false;
      recorder.ondataavailable=e=>{ if(e.data.size) recChunks.push(e.data); };
      recorder.onstop=async ()=>{
        const seg=(Date.now()-recStart)/1000;
        const blob=new Blob(recChunks,{type:(recorder&&recorder.mimeType)||'audio/webm'});
        const descartar=recDiscard;
        recorder=null;
        pararTodoDeVoz();
        if(descartar){ toast('Nota descartada'); return; }
        /* un toque accidental dejaba una nota de cero segundos que ni suena */
        if(seg<0.8 || blob.size<800){ toast('Muy corto, no lo guardo'); return; }
        const au=await saveAudioBlob(blob, Math.round(seg));
        m.audio.push(au); pendingMedia.audio.push(au);
        drawAudio(au.id);
        toast('Nota de voz de '+fmtDur(Math.round(seg))+' añadida');
      };
      recorder.start();

      recPanel.hidden=false;
      recPanel.innerHTML='<div class="recbar" role="status" aria-live="polite">'+
        '<span class="recdot" aria-hidden="true"></span>'+
        '<span class="rectime">0:00</span>'+
        '<canvas class="recwave" aria-hidden="true"></canvas>'+
        '<button type="button" class="recstop">Parar</button>'+
        '<button type="button" class="recdrop">Descartar</button></div>';
      recBtn.classList.add('rec'); recBtn.disabled=true;
      $('.recstop',recPanel).addEventListener('click',()=>{ recDiscard=false; if(recorder) recorder.stop(); });
      $('.recdrop',recPanel).addEventListener('click',()=>{ recDiscard=true; if(recorder) recorder.stop(); });
      try{
        const AC=window.AudioContext||window.webkitAudioContext;
        recCtx=new AC();
        const fuente=recCtx.createMediaStreamSource(recStream);
        const an=recCtx.createAnalyser(); an.fftSize=256; an.smoothingTimeConstant=.5;
        fuente.connect(an);
        pintarOnda(an, $('.recwave',recPanel));
      }catch(e){}
      const reloj=$('.rectime',recPanel);
      recTimer=setInterval(()=>{
        reloj.textContent=fmtDur((Date.now()-recStart)/1000);
      },200);
      setTimeout(()=>recPanel.scrollIntoView({block:'center',behavior:'smooth'}), 60);
    }
    recBtn.addEventListener('click', empezarVoz);
    pararVozAlCerrar=()=>{ recDiscard=true; if(recorder&&recorder.state==='recording'){ try{ recorder.stop(); }catch(e){} } else pararTodoDeVoz(); };

    /* guardar */
    $('#e-save',body).addEventListener('click',async ()=>{
      /* si estabas grabando al dar a guardar, la nota se queda, no se pierde */
      if(recorder && recorder.state==='recording'){ recDiscard=false; recorder.stop(); await new Promise(r=>setTimeout(r,500)); }
      m.title=title.value.trim(); m.note=note.value.trim();
      const d=dt.value? new Date(dt.value) : new Date();
      if(isNaN(d)){ toast('Esa fecha no vale'); return; }
      m.datetime=d.toISOString();
      const pl=$('#e-place',body).value.trim();
      m.placeId = pl ? await ensurePlace(pl) : null;
      const pending=$('#e-person',body).value.trim();
      if(pending){ const id=await ensurePerson(pending); if(id && m.peopleIds.indexOf(id)<0) m.peopleIds.push(id); }
      const pt=$('#e-tag',body).value.trim().replace(/^#/,'');
      if(pt && m.tags.indexOf(pt)<0) m.tags.push(pt);
      if(m.type==='ficha'){
        m.preset=m.preset||'vino';
        m.thingId = m.title ? await ensureThing(m.title, m.preset) : null;
      } else m.thingId=null;
      if(!m.title && !m.note && !m.photos.length && !m.audio.length){ toast('Escribe algo, aunque sea una palabra'); return; }
      m.updatedAt=new Date().toISOString();
      delete m._doc; delete m._toks;
      await dbPut('moments', m);
      const i=MOMENTS.findIndex(x=>x.id===m.id);
      if(i>=0) MOMENTS[i]=m; else MOMENTS.push(m);
      /* media que quitaste del momento se borra de verdad */
      const keep=new Set(); m.photos.forEach(p=>{keep.add(p.id); keep.add(p.thumbId);}); m.audio.forEach(a=>keep.add(a.id));
      const trash=[];
      for(const p of pendingMedia.photos) if(!keep.has(p.id)){ trash.push(p.id); if(p.thumbId) trash.push(p.thumbId); }
      for(const a of pendingMedia.audio) if(!keep.has(a.id)) trash.push(a.id);
      await deleteMedia(trash);
      saved=true;
      closeSheet();
      await refreshAll(m.id);
      toast(isNew? 'Guardado' : 'Actualizado');
    });
    const delBtn=$('#e-del',body);
    if(delBtn) delBtn.addEventListener('click',()=>{ saved=true; closeSheet(); confirmDelete(m); });
  }, {focus:isNew, onClose});
}

function confirmDelete(m){
  confirmSheet('¿Borrar este momento?', (m.title||'Sin título')+' — '+fmtFechaLarga(new Date(m.datetime))+'. No se puede deshacer.',
    'Sí, borrar', async ()=>{
      const ids=[]; (m.photos||[]).forEach(p=>{ids.push(p.id); if(p.thumbId)ids.push(p.thumbId);});
      (m.audio||[]).forEach(a=>ids.push(a.id));
      await deleteMedia(ids);
      await dbDel('moments', m.id);
      MOMENTS=MOMENTS.filter(x=>x.id!==m.id);
      await refreshAll();
      toast('Borrado');
    }, true);
}

let pickCB=null;
const picker=$('#picker');
function pickPhotos(cb){ pickCB=cb; picker.value=''; picker.click(); }
picker.addEventListener('change',()=>{
  const files=Array.from(picker.files||[]);
  if(files.length && pickCB) pickCB(files);
  pickCB=null;
});

/* ------------------------------------------------------------------ *
 * Ajustes, respaldo, importación
 * ------------------------------------------------------------------ */
function mimeExt(t){
  if(!t) return '.bin';
  if(t.indexOf('webp')>=0) return '.webp';
  if(t.indexOf('jpeg')>=0||t.indexOf('jpg')>=0) return '.jpg';
  if(t.indexOf('png')>=0) return '.png';
  if(t.indexOf('webm')>=0) return '.webm';
  if(t.indexOf('mp4')>=0) return '.m4a';
  if(t.indexOf('mpeg')>=0) return '.mp3';
  if(t.indexOf('aac')>=0) return '.aac';
  if(t.indexOf('ogg')>=0) return '.ogg';
  return '.bin';
}
function human(b){
  if(b==null) return '—';
  const u=['B','KB','MB','GB']; let i=0;
  while(b>=1024 && i<3){ b/=1024; i++; }
  return (i? b.toFixed(1):Math.round(b))+' '+u[i];
}
async function doExport(){
  toast('Preparando el respaldo…', 8000);
  const media=await dbAll('media');
  const doc={
    _formato:'ttrNow.export',
    _version:1,
    _doc:{
      que:'Respaldo completo de un diario ttrNow. Formato abierto: este zip contiene data.json y una carpeta media/ con las fotos y audios.',
      moments:'Cada momento: id (uuid), datetime (ISO 8601 local convertido a UTC), type (momento|hito|ficha|efemeride), preset (clave de ficha), thingId, title, note, tags[], peopleIds[], placeId, photos[{id,thumbId,w,h,takenAt,alt}], audio[{id,dur,mime}], fields{}, createdAt, updatedAt.',

async function doImport(file){
  try{
    toast('Leyendo el respaldo…', 8000);
    const map=await readZip(file);
    const dj=map.get('data.json');
    if(!dj) throw new Error('El zip no tiene data.json');
    const doc=JSON.parse(new TextDecoder().decode(dj));
    if(doc._formato && doc._formato!=='ttrNow.export') throw new Error('Formato desconocido');
    const mediaRecs=[];
    for(const x of (doc.media||[])){
      const bytes=map.get(x.file);
      if(!bytes) continue;
      mediaRecs.push({id:x.id, blob:new Blob([bytes],{type:x.mime||'application/octet-stream'}),
        mime:x.mime, kind:x.kind, w:x.w, h:x.h, dur:x.dur, size:bytes.length});
    }
    await dbPutMany('media', mediaRecs);
    await dbPutMany('people', doc.people||[]);
    await dbPutMany('places', doc.places||[]);
    await dbPutMany('things', doc.things||[]);
    await dbPutMany('moments', (doc.moments||[]).map(m=>{ const c=Object.assign({},m); delete c._doc; delete c._toks; return c; }));
    await loadAll();
    await refreshAll();
    closeSheet();
    toast('Importados '+(doc.moments||[]).length+' momentos y '+mediaRecs.length+' archivos');
  }catch(err){ toast('No pude importar: '+err.message, 4200); }
}

async function clearSeed(){
  const seeds=MOMENTS.filter(m=>m.seed);
  const ids=[];
  for(const m of seeds){ (m.photos||[]).forEach(p=>{ids.push(p.id); if(p.thumbId)ids.push(p.thumbId);}); (m.audio||[]).forEach(a=>ids.push(a.id)); }
  await deleteMedia(ids);
  for(const m of seeds) await dbDel('moments',m.id);
  for(const st of [['people',PEOPLE],['places',PLACES],['things',THINGS]]){
    for(const e of st[1].filter(x=>x.seed)) await dbDel(st[0], e.id);
  }
  await metaSet('seeded', true);
  await loadAll(); await refreshAll();
  toast('Ejemplos borrados');
}

async function updateNotice(){
  const el=$('#notice');
  const last=await metaGet('lastExport');
  const lastCount=(await metaGet('lastExportCount'))||0;
  const days= last ? Math.floor((Date.now()-last)/864e5) : null;
  const sinBackup = last ? MOMENTS.filter(m=>new Date(m.createdAt||m.datetime).getTime()>last).length : MOMENTS.filter(m=>!m.seed).length;
  if(!MOMENTS.length || sinBackup===0 || (days!==null && days<30)){ el.hidden=true; return; }
  el.hidden=false;
  el.innerHTML='<span>'+(last? 'Hace <b>'+days+' días</b> del último respaldo.' : 'Nunca has hecho un respaldo.')+
    ' <b>'+sinBackup+'</b> sin guardar fuera.</span><button type="button">Exportar</button>';
  $('button',el).addEventListener('click',doExport);
}

function genImage(pal, w, h){
  const c=document.createElement('canvas'); c.width=w||1100; c.height=h||820;
  const x=c.getContext('2d');
  x.fillStyle=pal[0]; x.fillRect(0,0,c.width,c.height);
  for(let i=1;i<pal.length;i++){
    const g=x.createRadialGradient(c.width*(.2+.6*Math.random()), c.height*(.15+.7*Math.random()), 0,
                                   c.width*.5, c.height*.5, c.width*(.5+.4*Math.random()));
    g.addColorStop(0,pal[i]); g.addColorStop(1,'rgba(0,0,0,0)');
    x.fillStyle=g; x.fillRect(0,0,c.width,c.height);
  }
  const img=x.getImageData(0,0,c.width,c.height), d=img.data;
  for(let i=0;i<d.length;i+=4){ const n=(Math.random()-.5)*16; d[i]+=n; d[i+1]+=n; d[i+2]+=n; }
  x.putImageData(img,0,0);
  return new Promise(res=>c.toBlob(res,'image/jpeg',.86));
}

async function seedDB(){
  const mk=(store,list,map,name,extra)=>ensureEntity(store,list,map,name,Object.assign({seed:true},extra||{}));
  for(const s of SEED){
    let when;
    if(s.dyn){                       // uno cae en el mismo día de hoy, años atrás,
      when=new Date();               // para que "hoy hace X años" no nazca vacío
      when.setFullYear(when.getFullYear()+s.dyn);
      const hm=(s.hora||'12:00').split(':');
      when.setHours(+hm[0], +hm[1], 0, 0);
    } else when=new Date(s.d);
    const m=newMoment({
      type: s.t||'momento', preset:s.preset||null, title:s.title, note:s.note||'',
      tags:s.tags||[], fields:s.fields||{}, seed:true,
      datetime:when.toISOString(),
      createdAt:when.toISOString(), updatedAt:when.toISOString()
    });
    for(const p of (s.people||[])){ const id=await mk('people',PEOPLE,PMAP,p); if(id) m.peopleIds.push(id); }
    if(s.place) m.placeId=await mk('places',PLACES,LMAP,s.place);
    if(m.type==='ficha') m.thingId=await mk('things',THINGS,TMAP,s.title,{kind:s.preset});
    if(s.img){
      try{
        const blob=await genImage(PAL[s.img]);
        const ph=await savePhoto(blob);
        ph.alt='Fotografía del recuerdo: '+s.title;
        m.photos.push(ph);
      }catch(e){}
    }
    MOMENTS.push(m);
    await dbPut('moments', m);
  }
  await metaSet('seeded', true);
}

/* ------------------------------------------------------------------ *
 * PWA: manifest e icono inyectados, service worker desde blob
 * ------------------------------------------------------------------ */
let swActive=false;
function makeIcon(size, maskable){
  const c=document.createElement('canvas'); c.width=c.height=size;
  const x=c.getContext('2d'), s=size, k=maskable?.72:.9;
  x.fillStyle='#0B0D10'; x.fillRect(0,0,s,s);
  let g=x.createRadialGradient(s*.5,s*.36,0,s*.5,s*.5,s*.62);
  g.addColorStop(0,'rgba(96,126,158,.42)'); g.addColorStop(1,'rgba(11,13,16,0)');
  x.fillStyle=g; x.fillRect(0,0,s,s);
  x.strokeStyle='rgba(233,229,221,.34)'; x.lineWidth=Math.max(1,s*.008);
  x.beginPath(); x.moveTo(s/2, s*(.5-k*.42)); x.lineTo(s/2, s*(.5+k*.42)); x.stroke();
  x.strokeStyle='rgba(233,229,221,.22)';
  [-.26,.14,.3].forEach((o,i)=>{
    const y=s*(.5+o*k), w=s*(i%2?.16:.2);
    x.beginPath(); x.moveTo(i%2? s/2 : s/2-w, y); x.lineTo(i%2? s/2+w : s/2, y); x.stroke();
    x.fillStyle='rgba(233,229,221,.5)';
    x.beginPath(); x.arc(s/2,y,s*.016,0,6.2832); x.fill();
  });
  x.fillStyle='#C6A15B';
  x.beginPath(); x.arc(s/2, s*.5, s*.05, 0, 6.2832); x.fill();
  x.shadowColor='#C6A15B'; x.shadowBlur=s*.08;
  x.beginPath(); x.arc(s/2, s*.5, s*.05, 0, 6.2832); x.fill();
  return c.toDataURL('image/png');
}
function setupPWA(){
  try{
    const icon=makeIcon(512,false), mask=makeIcon(512,true);
    $('#appleIcon').href=icon; $('#favicon').href=makeIcon(96,false);
    const manifest={
      name:'ttrNow', short_name:'ttrNow',
      description:'Diario personal en una sola línea de tiempo.',
      display:'standalone', orientation:'portrait',
      start_url: location.href, scope: location.href.replace(/[^/]*$/,''),
      background_color:'#0B0D10', theme_color:'#0B0D10', lang:'es',
      icons:[{src:icon,sizes:'512x512',type:'image/png',purpose:'any'},
             {src:mask,sizes:'512x512',type:'image/png',purpose:'maskable'}]
    };
    $('#manifestLink').href=URL.createObjectURL(new Blob([JSON.stringify(manifest)],{type:'application/manifest+json'}));
    /* Si la app está servida y al lado hay manifest e iconos de verdad, uso
       esos: iOS no siempre se cree un icono que nace de un data: URI, y ese
       icono lo vas a ver todos los días en la pantalla de inicio. Si no
       están, se queda el que acabo de dibujar y todo sigue funcionando. */
    if(location.protocol==='http:'||location.protocol==='https:'){
      /* GET y no HEAD: el service worker solo intercepta GET, y con un HEAD
         esto reventaba en consola cada vez que abrías sin cobertura */
      fetch('./manifest.webmanifest').then(r=>{
        if(!r.ok) return;
        $('#manifestLink').href='./manifest.webmanifest';
        $('#appleIcon').href='./apple-touch-icon.png';
      }).catch(()=>{});
    }
  }catch(e){}

  if(!('serviceWorker' in navigator) || location.protocol==='file:') return;

  /* Si la app está servida desde un hosting, al lado hay un sw.js de verdad:
     ese es el único que da offline en avión, porque un service worker no
     puede registrarse desde un blob (ningún navegador lo permite). Si no
     existe, la app funciona igual, solo sin caché propia. */
  navigator.serviceWorker.register('./sw.js',{scope:'./'})
    .then(()=>{ swActive=true; })
    .catch(()=>{ registrarDesdeBlob(); });
}
function registrarDesdeBlob(){
  const src=[
    "const C='ttrnow-v1', U="+JSON.stringify(location.href.split('#')[0])+";",
    "self.addEventListener('install',e=>{self.skipWaiting();e.waitUntil(caches.open(C).then(c=>c.add(U)).catch(()=>{}))});",
    "self.addEventListener('activate',e=>e.waitUntil(self.clients.claim()));",
    "self.addEventListener('fetch',e=>{if(e.request.method!=='GET')return;",
    "e.respondWith(caches.match(e.request,{ignoreSearch:true}).then(r=>r||fetch(e.request).then(res=>{",
    "const cc=res.clone();caches.open(C).then(c=>c.put(e.request,cc)).catch(()=>{});return res;}).catch(()=>caches.match(U))))});"
  ].join('');
  try{
    const url=URL.createObjectURL(new Blob([src],{type:'text/javascript'}));
    navigator.serviceWorker.register(url).then(()=>{ swActive=true; })
      .catch(()=>{ swActive=false; });
  }catch(e){ swActive=false; }
}

  if(!files.length) return;
  const zip=files.find(f=>/\.zip$/i.test(f.name)||f.type==='application/zip');
  if(zip){ doImport(zip); return; }
  const imgs=files.filter(f=>/^image\//.test(f.type));
  if(!imgs.length) return;
  const m=newMoment(), photos=[];
  for(const f of imgs){ try{ photos.push(await savePhoto(f)); }catch(err){} }
  m.photos=photos;
  const wd=photos.find(p=>p.takenAt); if(wd) m.datetime=wd.takenAt;
  openEditor(m, true);
});

/* ------------------------------------------------------------------ *
 * Arranque
 * ------------------------------------------------------------------ */
async function loadAll(){
  MOMENTS=await dbAll('moments');
  PEOPLE=await dbAll('people');
  PLACES=await dbAll('places');
  THINGS=await dbAll('things');
  PMAP=byId(PEOPLE); LMAP=byId(PLACES); TMAP=byId(THINGS);
}
function topVisibleKey(){
  let best=null;
  for(const v of visible.values()) if(v && (!best || v.e.t>best.e.t)) best=v;
  return best? best.e.key : null;
}
async function refreshAll(focusId){
  const anchor = focusId ? null : topVisibleKey();
  reindex();
  ENTRIES=buildEntries();
  visible.clear();
  resetTimeline();
  renderOnThisDay();
  updateNotice();
  const q=qEl.value.trim();
  if(q && !parseFecha(q)) applyFilter(q);
  let key=null;
  if(focusId){ const e=ENTRIES.find(x=>x.m.id===focusId); if(e) key=e.key; }
  else key=anchor;
  if(key){
    const idx=ENTRIES.findIndex(e=>e.key===key);
    if(idx>=0){
      await ensureRendered(idx+3);
      const r=rowIndex.get(key);
      if(r){ scrollToRow(r.el, false); if(focusId) flashRow(key); }
    }
  }
  updateHead();
}

async function init(){
  try{ db=await openDB(); }
  catch(e){ document.body.innerHTML='<p style="padding:40px;font:15px sans-serif;color:#E9E5DD">Este navegador no me deja usar IndexedDB, y sin eso no puedo guardar nada. Prueba a salir del modo privado.</p>'; return; }

  if(navigator.storage && navigator.storage.persist){
    try{ if(!(await navigator.storage.persisted())) await navigator.storage.persist(); }catch(e){}
  }
  await loadAll();
  if(!MOMENTS.length && !(await metaGet('seeded'))){
    try{ await seedDB(); }catch(e){}
    PMAP=byId(PEOPLE); LMAP=byId(PLACES); TMAP=byId(THINGS);
  }
  reindex();
  ENTRIES=buildEntries();
  resetTimeline();
  renderOnThisDay();
  updateNotice();
  sizeSky(); buildParts(); applyTint(); startSky();
  setYear(new Date().getFullYear());
  updateHead();
  setupPWA();
  window.addEventListener('beforeunload',()=>{ for(const [id,e] of URLS) URL.revokeObjectURL(e.url); });
}
init();

})();
